version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mfih-lms-db
    restart: always
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  mfih-lms-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    container_name: mfih-lms-container
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - /home/mfih/mfih_LMS/storage:/app/storage
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE_PATH=/app/storage
      - DATABASE_URL=postgres://lms_user:lms_password_123@postgres:5432/lms_db
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
